version: '3.9'

services:
  redis:
    image: redis
    container_name: redis
    ports:
      - '6379:6379'
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    networks:
      - cartera-network-dev
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: app
    networks:
      - cartera-network-dev
    restart: unless-stopped
    volumes:
      - .:/usr/src/app
    tty: true
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env.docker.env
    expose:
      - '${PORT}'
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST_NAME: redis
      REDIS_HOST_PORT: 6379
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${PORT}/api/ping || exit 1']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx
    ports:
      - '80:80'
    restart: always
    networks:
      - cartera-network-dev
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:80/api/ping || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  cartera-network-dev:
    driver: bridge
