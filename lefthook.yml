# Git hooks gerenciados pelo lefthook.
# Instalar/atualizar os hooks: `yarn lefthook install`

# Carrega node/npx do nvm no PATH quando o git roda os hooks fora de um shell
# com nvm (ex.: git de IDE/GUI). Ver .lefthookrc.
rc: .lefthookrc

pre-commit:
  parallel: true
  jobs:
    - name: arch-guard
      # Roda só quando há .ts staged. Barra violação de fronteira (errors).
      # Warnings (órfãos do código antigo) NÃO bloqueiam — exit 0.
      glob: "src/**/*.ts"
      # ponytail: o cruiser e o tsc leem a árvore de trabalho, não o snapshot staged; a CI relê o commit.
      run: npm run --silent arch:check
      fail_text: "Violação de fronteira arquitetural (arch-guard). Corrija antes de commitar — ver CLAUDE.md §4."
    - name: typecheck
      glob: "src/**/*.ts"
      run: npx tsc --noEmit
      fail_text: "Erro de tipo (tsc --noEmit). Ver AGENTS.md, Commands."
    - name: eslint-boundaries
      glob: "src/**/*.ts"
      run: npx eslint {staged_files}
      fail_text: "Violação de fronteira de import (ESLint). Ver CLAUDE.md §4/§9."
    - name: route-convention
      glob:
        - "src/features/**/infra/http/*.route.ts"
        - "src/features/**/infra/http/*.controller.ts"
      run: npx jest src/shared/http/route-convention.spec.ts --silent --runInBand
      fail_text: "Rota fora da convenção (@swagger / runValidate / registro em <feature>.routes.ts). Ver CLAUDE.md §9."

pre-push:
  jobs:
    - name: block-push-main
      # Preserva a regra antiga: push direto pra main bloqueado.
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "main" ]; then
          echo "🚫 Push direto para 'main' bloqueado. Use branch + Pull Request."
          exit 1
        fi
